<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Boost - Free Engagement</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #06b6d4;
            font-size: 2.8rem;
            letter-spacing: 1px;
            font-weight: 800;
            text-shadow: 0 4px 10px rgba(6, 182, 212, 0.3);
        }

        .header h1 span {
            color: #ffffff;
        }

        .container {
            background: #1e293b;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid #334155;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .platform-select {
            margin-bottom: 24px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #cbd5e1;
            font-size: 0.95rem;
        }

        select, input {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            font-size: 1rem;
            color: #ffffff;
            outline: none;
            transition: all 0.3s ease;
        }

        select:focus, input:focus {
            border-color: #06b6d4;
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
        }

        .btn {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.6);
        }

        /* Task Modal Box */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid #475569;
            padding: 35px;
            border-radius: 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal h3 {
            color: #f43f5e;
            font-size: 1.5rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .task-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .task-btn:hover {
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
        }

        .success-text {
            color: #34d399;
            font-weight: bold;
            margin-top: 20px;
            padding: 12px;
            background: rgba(52, 211, 153, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(52, 211, 153, 0.2);
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>SOCIAL <span>BOOST</span></h1>
    </div>

    <div class="container">
        <p class="subtitle">නොමිලේම Likes, Followers සහ Views ලබාගන්නා ලංකාවේ අංක 1 ඇප් එක 🚀</p>

        <div class="platform-select">
            <label>Social Media ජාලය තෝරන්න:</label>
            <select id="platform">
                <option value="Facebook">Facebook</option>
                <option value="Instagram">Instagram</option>
                <option value="YouTube">YouTube</option>
                <option value="TikTok">TikTok</option>
            </select>
        </div>

        <div class="platform-select">
            <label>ඔබට අවශ්‍ය සේවාව:</label>
            <select id="service">
                <option value="Likes">Free Likes (ක්ෂණිකව)</option>
                <option value="Followers">Free Followers (ක්ෂණිකව)</option>
                <option value="Views">Free Views (ක්ෂණිකව)</option>
            </select>
        </div>

        <div class="platform-select">
            <label>Post හෝ Profile Link එක ඇතුළත් කරන්න:</label>
            <input type="url" id="link" placeholder="https://..." required>
        </div>

        <button class="btn" onclick="startTask()">Get Free Boost 🚀</button>
    </div>

    <div class="modal" id="taskModal">
        <div class="modal-content">
            <h3>⚠️ අවසාන පියවර!</h3>
            <p style="margin-bottom: 20px; color: #94a3b8; line-height: 1.6;">නොමිලේ සේවාව ලබා ගැනීමට පහත කොළ පාට බටන් එක ඔබා, ලැබෙන වෙබ් අඩවියේ තත්පර 15ක් රැඳී සිටින්න.</p>
            
            <button class="btn task-btn" onclick="completeTask('https://accuracyinstalled.com/dfqtgb0x?key=b12ad89e95fd18229debae06736f6393')">Complete Task & Get Likes 🟢</button>
            
            <p class="success-text" id="successMsg">✅ ඔබගේ ඉල්ලීම සාර්ථකයි! විනාඩි 5ක් ඇතුළත Boost වීම ආරම්භ වේ.</p>
        </div>
    </div>

    <script>
        function startTask() {
            var urlInput = document.getElementById('link').value;
            if(urlInput === "") {
                alert("කරුණාකර ඔබගේ ලින්ක් එක ඇතුළත් කරන්න!");
                return;
            }
            document.getElementById('taskModal').style.display = 'flex';
        }

        function completeTask(shortLink) {
            window.open(shortLink, '_blank');
            
            setTimeout(function() {
                document.getElementById('successMsg').style.display = 'block';
                setTimeout(function() {
                    document.getElementById('taskModal').style.display = 'none';
                    document.getElementById('successMsg').style.display = 'none';
                    document.getElementById('link').value = "";
                }, 5000);
            }, 2000);
        }
    </script>

</body>
</html>
